<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Advertisement - Aurora X2 Headphones</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="page-wrap">
    <header class="hero">
      <h2>Featured Product</h2>
      <p>Experience premium sound and comfort.</p>
    </header>

    <main class="container">
      <article class="product-card">
        <figure class="product-image">
          <img src="headphones.jpg" alt="Aurora X2 Wireless Headphones" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1518444021875-3f0d5c1d0b2b?auto=format&fit=crop&w=1200&q=80'">
        </figure>

        <div class="product-details">
          <h1 class="product-name">Aurora X2 Wireless Headphones</h1>

          <ul class="features">
            <li>Active Noise Cancellation (ANC)</li>
            <li>Bluetooth 5.3 with multipoint pairing</li>
            <li>Up to 40 hours battery life</li>
            <li>Fast charge: 10 min → 5 hours</li>
          </ul>

          <div class="purchase-row">
            <div class="price">$199.99</div>
            <button class="buy-btn" aria-label="Buy Aurora X2 Headphones">Buy Now</button>
          </div>
        </div>
      </article>
    </main>

    <footer class="footer">
      <small>Lab exercise: Product Advertisement Page — HTML & CSS</small>
    </footer>
  </div>
</body>
</html>
