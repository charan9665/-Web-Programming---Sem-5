<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Country and Capital Selector</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Find a Country's Capital</h1>
    <label for="country">Select a country:</label>
    <select id="country">
      <option value="">-- Choose a country --</option>
      <option value="New Delhi">India</option>
      <option value="Canberra">Australia</option>
      <option value="Ottawa">Canada</option>
      <option value="Tokyo">Japan</option>
      <option value="Paris">France</option>
    </select>
    <p id="capital" aria-live="polite"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
