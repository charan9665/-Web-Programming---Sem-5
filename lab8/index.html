<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 8 - Registration Form</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <header class="page-header">
      <p class="lab-label">WEB PROGRAMMING · LAB 8</p>
      <h1>Registration Form</h1>
      <p>Enter your details below. All fields are required.</p>
    </header>

    <section class="card" aria-labelledby="form-heading">
      <h2 id="form-heading">Your information</h2>

      <form id="registration-form" action="display.html" novalidate>
        <div class="form-grid">
          <div class="form-group">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" autocomplete="name"
              placeholder="Your full name" aria-describedby="name-error" required>
            <p class="field-error" id="name-error" aria-live="polite"></p>
          </div>

          <fieldset class="form-group gender-group">
            <legend>Gender</legend>
            <div class="radio-options">
              <label class="radio-label">
                <input type="radio" name="gender" value="Male">
                <span>Male</span>
              </label>
              <label class="radio-label">
                <input type="radio" name="gender" value="Female">
                <span>Female</span>
              </label>
              <label class="radio-label">
                <input type="radio" name="gender" value="Other">
                <span>Other</span>
              </label>
            </div>
            <p class="field-error" id="gender-error" aria-live="polite"></p>
          </fieldset>

          <div class="form-group">
            <label for="mobile">Mobile Number</label>
            <input id="mobile" name="mobile" type="tel" inputmode="numeric"
              autocomplete="tel" maxlength="10" placeholder="10-digit number"
              aria-describedby="mobile-error" required>
            <p class="field-error" id="mobile-error" aria-live="polite"></p>
          </div>

          <div class="form-group">
            <label for="email">Email ID</label>
            <input id="email" name="email" type="email" autocomplete="email"
              placeholder="you@example.com" aria-describedby="email-error" required>
            <p class="field-error" id="email-error" aria-live="polite"></p>
          </div>

          <div class="form-group">
            <label for="city">City</label>
            <input id="city" name="city" type="text" autocomplete="address-level2"
              placeholder="Your city" aria-describedby="city-error" required>
            <p class="field-error" id="city-error" aria-live="polite"></p>
          </div>

          <div class="form-group">
            <label for="state">State</label>
            <select id="state" name="state" aria-describedby="state-error" required>
              <option value="">Select a state</option>
              <option>Andhra Pradesh</option>
              <option>Tamil Nadu</option>
              <option>Karnataka</option>
              <option>Telangana</option>
              <option>Kerala</option>
              <option>Maharashtra</option>
              <option>Goa</option>
              <option>Uttar Pradesh</option>
              <option>Delhi</option>
            </select>
            <p class="field-error" id="state-error" aria-live="polite"></p>
          </div>

          <div class="form-group">
            <label for="country">Country</label>
            <select id="country" name="country" aria-describedby="country-error" required>
              <option value="">Select a country</option>
              <option>India</option>
              <option>USA</option>
              <option>United Kingdom</option>
              <option>Australia</option>
              <option>Canada</option>
              <option>New Zealand</option>
            </select>
            <p class="field-error" id="country-error" aria-live="polite"></p>
          </div>
        </div>

        <p class="form-message" id="form-message" role="alert"></p>

        <div class="button-row">
          <button class="button button-primary" type="submit">Submit</button>
          <button class="button button-secondary" type="reset">Reset</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
