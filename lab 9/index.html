<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 9 - XML Data Table Viewer</title>

    <!-- ================= CSS ================= -->
    <style>
        :root {
            --primary: #1f3a5f;
            --accent: #2e86de;
            --accent-dark: #1b6ec2;
            --bg: #eef2f7;
            --border: #d5dde8;
            --stripe: #f5f8fc;
            --error: #c0392b;
            --success: #1e8449;
        }

        * { box-sizing: border-box; }

        body {
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 30px 15px;
            color: #2c3e50;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-top: 0;
            color: var(--primary);
            border-bottom: 3px solid var(--accent);
            padding-bottom: 10px;
        }

        .buttons { margin-bottom: 10px; }

        button {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 10px 18px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 8px;
            transition: background 0.2s;
        }
        button:hover { background: var(--accent-dark); }
        button.secondary { background: #7f8c8d; }
        button.secondary:hover { background: #636e6f; }
        button:focus-visible { outline: 3px solid #f5b041; outline-offset: 2px; }

        .status { margin: 12px 0; font-weight: 600; min-height: 22px; }
        .status.success { color: var(--success); }
        .status.error   { color: var(--error); }

        /* Wrapper lets the table scroll sideways on small screens */
        .table-wrap { overflow-x: auto; }

        table { width: 100%; border-collapse: collapse; }

        th, td {
            padding: 11px 14px;
            border: 1px solid var(--border);
            text-align: left;
        }

        thead th { background: var(--primary); color: #fff; }
        tbody tr:nth-child(even) { background: var(--stripe); }   /* zebra stripes */
        tbody tr:hover { background: #dcebfa; }                   /* hover highlight */
        td.price, th.price { text-align: right; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Book Store - XML Data Viewer</h2>

        <div class="buttons">
            <button id="loadBtn" onclick="loadXML()">Load XML Data</button>
            <button class="secondary" onclick="clearTable()">Clear Table</button>
        </div>

        <!-- Status / error message -->
        <div id="status" class="status"></div>

        <!-- The table is built here by JavaScript -->
        <div id="tableContainer" class="table-wrap"></div>
    </div>

    <!-- ================= JavaScript ================= -->
    <script>
        /* Backup copy of books.xml, used only if fetch() fails (file:// or missing file) */
        const embeddedXML = `<?xml version="1.0" encoding="UTF-8"?>
<bookstore>
    <book id="BK101" category="Computer Science"><title>Learning Machine Learning</title><author>John Doe</author><price>49.99</price></book>
    <book id="BK102" category="Web Development"><title>Mastering XML &amp; Web Services</title><author>Jane Smith</author><price>39.95</price></book>
    <book id="BK103" category="Web Development"><title>JavaScript: The Practical Guide</title><author>Ravi Kumar</author><price>34.50</price></book>
    <book id="BK104" category="Databases"><title>Database Systems Made Simple</title><author>Asha Reddy</author><price>42.00</price></book>
    <book id="BK105" category="Computer Science"><title>Data Structures with Java</title><author>Michael Brown</author><price>45.75</price></book>
    <book id="BK106" category="Networking"><title>Computer Networks Explained</title><author>Priya Sharma</author><price>38.20</price></book>
</bookstore>`;
        /* Show a message: type is "success" or "error" */
        function showStatus(message, type) {
            const status = document.getElementById("status");
            status.textContent = message;
            status.className = "status " + (type || "");
        }

        /* Step 1: fetch books.xml as plain text, then hand it to the parser.
           Note: fetch() needs the page to be served over HTTP
           (e.g. VS Code Live Server or "python -m http.server"). */
        function loadXML() {
            fetch("books.xml")
                .then(function (response) {
                    if (!response.ok) {
                        throw new Error("books.xml could not be loaded (HTTP " + response.status + ").");
                    }
                    return response.text();
                })
                .then(function (text) {
                    parseXML(text);
                })
                .catch(function () {
                    // fetch() is blocked when the page is opened directly from disk (file://).
                    // Fall back to the embedded copy of books.xml so the table still shows.
                    parseXML(embeddedXML);
                    document.getElementById("status").textContent +=
                        " (loaded from embedded XML; run a local server to read books.xml)";
                });
        }

        /* Step 2: convert the text into an XML DOM using DOMParser */
        function parseXML(text) {
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(text, "text/xml");

            // If the XML is invalid, the browser inserts a <parsererror> element
            if (xmlDoc.getElementsByTagName("parsererror").length > 0) {
                clearTable();
                showStatus("Error: the XML file is not well-formed.", "error");
                return;
            }
            displayTable(xmlDoc);
        }

        /* Step 3: read each <book> and build the table using DOM methods */
        function displayTable(xmlDoc) {
            const books = xmlDoc.getElementsByTagName("book");
            const container = document.getElementById("tableContainer");
            container.innerHTML = "";   // remove any old table

            const table = document.createElement("table");

            // ----- Header row -----
            const headers = ["S.No", "Book ID", "Category", "Title", "Author", "Price (Rs.)"];
            const thead = document.createElement("thead");
            const headRow = document.createElement("tr");
            headers.forEach(function (name) {
                const th = document.createElement("th");
                th.appendChild(document.createTextNode(name));
                if (name.indexOf("Price") === 0) th.className = "price";
                headRow.appendChild(th);
            });
            thead.appendChild(headRow);
            table.appendChild(thead);

            // ----- Body rows -----
            const tbody = document.createElement("tbody");
            for (let i = 0; i < books.length; i++) {
                const book = books[i];

                // Attributes -> getAttribute(); child elements -> textContent
                const values = [
                    i + 1,
                    book.getAttribute("id"),
                    book.getAttribute("category"),
                    book.getElementsByTagName("title")[0].textContent,
                    book.getElementsByTagName("author")[0].textContent,
                    parseFloat(book.getElementsByTagName("price")[0].textContent).toFixed(2)
                ];

                const row = document.createElement("tr");
                values.forEach(function (value, index) {
                    const td = document.createElement("td");
                    td.appendChild(document.createTextNode(value));
                    if (index === 5) td.className = "price";   // right-align price
                    row.appendChild(td);
                });
                tbody.appendChild(row);
            }
            table.appendChild(tbody);
            container.appendChild(table);

            showStatus(books.length + " records loaded successfully.", "success");
        }

        /* Reset the page */
        function clearTable() {
            document.getElementById("tableContainer").innerHTML = "";
            showStatus("", "");
        }
    </script>
</body>
</html>
